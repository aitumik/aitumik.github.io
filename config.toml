baseURL = '/'
languageCode = 'en-us'
title = 'Nathan'

copyright = ""
paginate = 10
defaultContentLanguage = "en"

hasCJKLanguage = true
enableInlineShortcodes = true
enableEmoji = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

disqusShortname = ""
googleAnalytics = ""

[outputs]
home = ["HTML", "RSS"]

[taxonomies]
category = "categories"
tag = "tags"
series = "series"
politics = "politics"

[markup]
[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = false
lineNumbersInTable = false
style = "nord"
tabWidth = 4

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]


[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$'], ['\\[', '\\]']]
inline = [['$', '$'], ['\\(', '\\)']]

[menu]

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 10

[[menu.main]]
identifier = "posts"
name = "Writing"
url = "/posts/"
weight = 20

[[menu.main]]
identifier = "projects"
name = "Portfolio"
url = "/projects/"
weight = 30

[[menu.main]]
identifier = "research"
name = "Research"
url = "/research/"
weight = 40

[[menu.main]]
identifier = "archive"
name = "Archive"
url = "/archive/"
weight = 50

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 60

[[menu.main]]
identifier = "github"
name = "GitHub"
url = "https://github.com/aitumik"
weight = 100


[params]
author = "Nathan"
description = "Engineer | Hacker | Philosopher"
keywords = "blog,developer,personal"
# Sections shown on the homepage, in order.
mainSections = ["posts"]
# Shown in the homepage hero. Keep this short - it is the first thing a visitor reads.
tagline = "I build systems close to the metal and write about what I learn along the way."

[params.social]
twitter = "aitumik"
github = "aitumik"
linkedin = "nathan_kimutai"
rss = true
