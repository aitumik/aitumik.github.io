{{ define "main" }}
<div class="post-list">
    {{ range (where .Site.RegularPages "Type" "in" .Site.Params.mainSections) }}
    <div class="post-item">
        <div class="post-meta">{{ .Date.Format "Jan 02, 2006" }}</div>
        <a href="{{ .RelPermalink }}" class="post-title">{{ .Title }}</a>
        <div class="post-summary">
            {{ .Summary }}
        </div>
    </div>
    {{ end }}
</div>
{{ end }}
