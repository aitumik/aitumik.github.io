{{ define "main" }}
<div class="page-header">
    <h1>{{ .Title }}</h1>
    <div class="content">
        {{ .Content }}
    </div>
</div>

<div class="post-list">
    {{ range .Pages }}
    <div class="post-item">
        <div class="post-meta">{{ .Date.Format "Jan 02, 2006" }}</div>
        <a href="{{ .RelPermalink }}" class="post-title">{{ .Title }}</a>
        <div class="post-summary">
            {{ .Summary }}
        </div>
    </div>
    {{ end }}
</div>
{{ end }}
