{{ define "main" }}
<section class="page-header">
    <h1>{{ .Title }}</h1>
</section>
{{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
{{- $terms := .Data.Terms.ByCount }}
{{- if $terms }}
<ul class="term-list">
    {{- range $terms }}
    <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
        <span class="term-count">{{ .Count }}</span>
    </li>
    {{- end }}
</ul>
{{- else }}
<p class="empty">No {{ .Title }} yet.</p>
{{- end }}
{{ end }}
