# Projects are rendered as cards on /projects/, newest first.
# Required: name, description. Optional: repo, url, tags, year.
projects:
  - name: Movies API
    description: A small movies API covering the create, read and delete operations, written to get comfortable with API design.
    repo: https://github.com/aitumik/greenlight
    tags: [Go, API]
  - name: Container Runtime
    description: Upstream test coverage for the hostNetwork helper on Linux and Windows - 231 lines of tests merged into the 1.7 release by a maintainer.
    url: https://github.com/containerd/containerd/pull/7984
    repo: https://github.com/containerd/containerd
    tags: [Go, Open Source, Testing]
  - name: LogNet
    description: A logging framework for Go - messages are produced and consumed over HTTP, with sinks for files, databases and external services.
    repo: https://github.com/aitumik/lognet
    tags: [Go, Logging]
  - name: IoT Sensor Dashboard
    description: A dashboard and API for temperature and humidity readings, fed by custom firmware on an ESP8266 reading a DHT11 sensor.
    url: https://github.com/aitumik/firmware-api
    repo: https://github.com/aitumik/firmware
    tags: [C++, IoT, Embedded]
  - name: MicroGrad
    description: A NumPy tensor library - broadcasting, matmul, transpose, reshape and reductions, with a test suite. The beginnings of an autograd engine, built to learn deep learning from the inside.
    repo: https://github.com/aitumik/likklegrad
    tags: [Python, NumPy, Deep Learning]
  - name: MediAlert
    description: A medicine reminder app - a Flask and Docker service with a notifications UI for keeping track of ongoing medication.
    tags: [Python, Flask, Docker]
  - name: Reed-Solomon Codes
    description: Error-correcting codes over GF(2^8), implemented from scratch - finite field arithmetic, generator polynomials and Berlekamp-Massey. Encoding works; correction is still in progress.
    repo: https://github.com/aitumik/reed-solomon-code
    tags: [Python, Coding Theory, Mathematics]

