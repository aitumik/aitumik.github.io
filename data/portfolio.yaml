# Projects are rendered as cards on /projects/, newest first.
# Required: name, description. Optional: repo, url, tags, year.
projects:
  - name: Scapegoauth
    description: An OAuth 2 resource server protocol implementation in Go, built to understand how the spec actually behaves in practice.
    repo: https://github.com/aitumik/scapegoauth
    tags: [Go, OAuth 2.0]
  - name: Snippetbox
    description: A Go application for curating and organising code snippets, with storage, templating and server-side rendering.
    repo: https://github.com/aitumik/snippetbox
    url: https://aitumik-snippetbox.fly.dev/
    tags: [Go, Web]
  - name: Greenlight API
    description: A small movies API covering the create, read and delete operations, written to get comfortable with API design.
    repo: https://github.com/aitumik/greenlight
    tags: [Go, API]
  - name: Contributions to containerd
    description: Open-source work on a widely used container runtime - reading unfamiliar Go code at scale and shipping changes upstream.
    repo: https://github.com/containerd/containerd
    tags: [Go, Open Source]

